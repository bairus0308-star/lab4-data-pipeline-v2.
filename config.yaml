# Lab 4 configuration (stored in the run manifest next to the data hash)
seed: 42
test_size: 0.30
openml:
  name: adult
  version: 2
expected:
  rows: 48842
  cols: 15
target: income
positive_label: ">50K"
schema:            # type per column
  age: int
  workclass: category
  fnlwgt: int
  education: category
  education-num: int
  marital-status: category
  occupation: category
  relationship: category
  race: category
  sex: category
  capital-gain: int
  capital-loss: int
  hours-per-week: int
  native-country: category
  income: category
ranges:            # inclusive
  age: [17, 90]
  hours-per-week: [1, 99]
  capital-gain: [0, 99999]
  capital-loss: [0, 4356]
clip_percentiles: [1, 99]
audit_sample_size: 50
paths:
  raw: data/raw/adult_raw.csv
  train: data/processed/train.csv
  test: data/processed/test.csv
  results: results
